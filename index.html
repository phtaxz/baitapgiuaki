<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đèn Kéo Quân Đông Hồ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="main-title">ĐÈN KÉO QUÂN TRANH ĐÔNG HỒ</h1>

    <div class="scene">
        <div class="carousel" id="denKeoQuan">
            <div class="face" style="--i:1;">
                <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Dong-ho-rat-wedding.jpg" alt="Đám cưới chuột">
            </div>
            
            <div class="face" style="--i:2;">
                <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Lợn_âm_dương.JPG" alt="Lợn âm dương">
            </div>
            
            <div class="face" style="--i:3;">
                <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Đấu_vật.JPG" alt="Đấu vật">
            </div>
            
            <div class="face" style="--i:4;">
                <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Hái_dừa.JPG" alt="Hứng dừa">
            </div>
            
            <div class="face" style="--i:5;">
                <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Đánh_ghen.JPG" alt="Đánh ghen">
            </div>
            
            <div class="face" style="--i:6;">
                <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Mục_đồng_thả_diều.JPG" alt="Mục đồng">
            </div>
        </div>
        
        <div class="light-core"></div>
    </div>

    <div class="guide">Di chuột vào tranh để dừng đèn</div>

    <script src="script.js"></script>

</html>
